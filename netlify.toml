[build]
  command = "python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Serverless functions. deploy-succeeded.mjs pings IndexNow automatically
# after every successful deploy for pages whose sitemap <lastmod> is recent.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
